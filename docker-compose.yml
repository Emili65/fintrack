services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/fintrack
      DB_USER: fintrack
      DB_PASSWORD: ${DB_PASSWORD:-fintrack}
      JWT_SECRET: ${JWT_SECRET:-ZmludHJhY2stZGV2LXNlY3JldC1rZXktY2FtYmlhbWUtZW4tcHJvZHVjY2lvbi0yMDI2}
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
