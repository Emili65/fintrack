server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El frontend y la API quedan en el mismo origen: no hace falta CORS en producción
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # Archivos con hash: caché larga
  location ~* \.(js|css|woff2?|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de Angular (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
