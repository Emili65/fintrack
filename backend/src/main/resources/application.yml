spring:
  application:
    name: fintrack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USER:fintrack}
    password: ${DB_PASSWORD:fintrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # El esquema lo controla Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    # Clave en Base64 (mínimo 256 bits). En producción SIEMPRE se sobreescribe con la variable JWT_SECRET.
    secret: ${JWT_SECRET:ZmludHJhY2stZGV2LXNlY3JldC1rZXktY2FtYmlhbWUtZW4tcHJvZHVjY2lvbi0yMDI2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed-demo: ${SEED_DEMO:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
